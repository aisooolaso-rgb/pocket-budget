<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102a43"><title>Pocket Budget</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#172b40;background:#f4f7fa}*{box-sizing:border-box}body{margin:0}main{max-width:620px;margin:auto;padding:20px 16px 100px}h1{font-size:24px;margin:4px 0 14px}h2{font-size:18px;margin:0 0 14px}.muted{color:#718096;font-size:13px}.card{background:white;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #16324b0a}.flex{display:flex;align-items:center;justify-content:space-between;gap:10px}.big{font-size:32px;font-weight:800;letter-spacing:-1px}.pill{border-radius:20px;background:#edf3f8;padding:5px 10px;font-size:12px}.bar{height:9px;background:#e8eef3;border-radius:20px;overflow:hidden;margin:9px 0}.fill{height:100%;background:#3975c5;border-radius:20px}.danger{color:#c23c46!important}.fill.danger{background:#d45159}button{font:inherit;cursor:pointer;border:0;border-radius:12px;background:#153d62;color:white;padding:12px 15px;font-weight:650}button.secondary{background:#edf2f6;color:#23435e}button.ghost{background:transparent;color:#345b7b;padding:7px}button:active{opacity:.75}input,select,textarea{font:inherit;width:100%;padding:12px;border:1px solid #d9e2ea;border-radius:11px;background:white;color:#172b40;min-width:0}label{font-size:13px;font-weight:650;display:block;margin:12px 0 5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.category{padding:12px 0;border-bottom:1px solid #edf0f3}.category:last-child{border:0}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e1e7ed;display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:4}.nav button{background:transparent;color:#657789;border-radius:10px;flex:1;max-width:155px;font-size:12px;padding:9px 2px}.nav button.active{background:#e8f0f8;color:#173f68}.hidden{display:none!important}.row{padding:12px 0;border-bottom:1px solid #edf0f3}.row:last-child{border:0}.right{text-align:right}.small{font-size:12px}.chip{display:inline-block;padding:4px 9px;background:#eef2f7;border-radius:8px;margin:2px;font-size:12px}.error{color:#b72834}.success{color:#23765d}canvas{width:100%;height:170px} .space{margin-top:12px} .full{width:100%}dialog{border:0;border-radius:18px;padding:20px;width:min(92vw,420px);box-shadow:0 20px 80px #0004}dialog::backdrop{background:#001a2a77} dialog{max-width:calc(100vw - 24px);max-height:calc(100dvh - 32px);overflow-y:auto} dialog input[type="date"]{display:block;width:100%;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none} dialog form{min-width:0;width:100%} .nowrap{white-space:nowrap}
</style></head><body><main><header class="flex"><div><div class="muted">PERSONAL SPENDING</div><h1>Pocket Budget</h1></div><span class="pill">自分の飲食・交際費</span></header><section id="home"></section><section id="entries" class="hidden"></section><section id="analysis" class="hidden"></section><section id="settings" class="hidden"></section></main><nav class="nav" aria-label="画面切り替え"><button data-tab="home" class="active">⌂<br>ホーム</button><button data-tab="entries">＋<br>記録</button><button data-tab="analysis">▥<br>分析</button><button data-tab="settings">⚙<br>設定</button></nav><dialog id="editDialog"><h2 id="dialogTitle">支出登録</h2><form id="entryForm"><input type="hidden" id="entryId"><label for="date">日付</label><input type="date" id="date" required><label for="category">分類</label><select id="category" required></select><label for="amount">金額（円）</label><input type="number" id="amount" min="1" max="99999999" step="1" inputmode="numeric" required><label for="payment">支払方法</label><select id="payment" required></select><label for="shop">店名（任意）</label><input id="shop" maxlength="80"><label for="memo">メモ（任意）</label><textarea id="memo" rows="2" maxlength="300"></textarea><div class="flex space"><button type="button" class="secondary" id="cancelDialog">キャンセル</button><button type="submit">保存する</button></div></form></dialog><script>
(()=>{'use strict';const KEY='pocket-budget-v1';const DEFAULT={categories:[{id:'c1',name:'飲み会',budget:20000,color:'#5681c7'},{id:'c2',name:'ランチ',budget:15000,color:'#e0a14a'},{id:'c3',name:'コーヒー',budget:3000,color:'#4ba58a'}],payments:['現金','QR決済','クレジットカード','その他'],entries:[],budgets:{}};const $=id=>document.getElementById(id),yen=n=>'¥'+Math.round(n).toLocaleString('ja-JP'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};function currentMonth(){return today().slice(0,7)}function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return valid(x)?x:structuredClone(DEFAULT)}catch{return structuredClone(DEFAULT)}}function valid(x){return x&&Array.isArray(x.categories)&&Array.isArray(x.entries)&&Array.isArray(x.payments)&&x.budgets&&typeof x.budgets==='object'&&x.categories.every(c=>typeof c.id==='string'&&typeof c.name==='string'&&Number.isFinite(c.budget))&&x.entries.every(e=>typeof e.id==='string'&&typeof e.date==='string'&&typeof e.categoryId==='string'&&Number.isFinite(e.amount))}const PALETTE=['#5681c7','#e0a14a','#4ba58a','#9b78c8','#d66c86','#6d94a0','#a28b6b','#6575cf'];function color(c){return /^#[0-9a-fA-F]{6}$/.test(c.color||'')?c.color:PALETTE[state.categories.indexOf(c)%PALETTE.length]}let state=load(),tab='home',month=currentMonth();function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch{alert('保存できませんでした。空き容量やブラウザ設定を確認してください。');return false}}function budget(c,m=month){return state.budgets[m]&&Object.prototype.hasOwnProperty.call(state.budgets[m],c.id)?state.budgets[m][c.id]:c.budget}function records(m=month){return state.entries.filter(e=>e.date.slice(0,7)===m)}function sums(m=month){const r=records(m),spent=r.reduce((a,e)=>a+e.amount,0),planned=state.categories.reduce((a,c)=>a+budget(c,m),0);return {r,spent,planned}}function monthControl(){return `<div class="flex"><button class="secondary" id="prevMonth">‹</button><strong>${esc(month.replace('-','年'))}月</strong><button class="secondary" id="nextMonth">›</button></div>`}function summary(){const {spent,planned}=sums(),pct=planned?spent/planned*100:0;return `<div class="card">${monthControl()}<p class="muted">今月の支出</p><div class="big">${yen(spent)}</div><div class="flex"><span class="muted">合計予算 ${yen(planned)}</span><strong class="${spent>planned?'danger':''}">${planned>=spent?'残り ':'超過 '}${yen(Math.abs(planned-spent))}</strong></div><div class="bar"><div class="fill ${spent>planned?'danger':''}" style="width:${Math.min(100,pct)}%"></div></div><div class="muted right">予算消化率 ${planned?Math.round(pct)+'%':'未設定'}</div></div>`}function categoriesHTML(){return state.categories.map(c=>{let r=records().filter(e=>e.categoryId===c.id),sum=r.reduce((a,e)=>a+e.amount,0),b=budget(c);return `<div class="category"><div class="flex"><strong><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${color(c)};margin-right:7px"></span>${esc(c.name)}</strong><strong class="${sum>b?'danger':''}">${yen(sum)} / ${yen(b)}</strong></div><div class="bar"><div style="background:${sum>b?'#d45159':color(c)}" class="fill ${sum>b?'danger':''}" style="width:${b?Math.min(100,sum/b*100):sum?100:0}%"></div></div><div class="flex muted"><span>${r.length}回・平均 ${yen(r.length?sum/r.length:0)}</span><span>${sum>b?'超過':'残り'} ${yen(Math.abs(b-sum))}</span></div></div>`}).join('')||'<p class="muted">分類がありません。設定から追加してください。</p>'}function home(){return summary()+`<div class="card"><div class="flex"><h2>分類別の支出</h2><button class="ghost" data-go="settings">予算設定 ›</button></div>${categoriesHTML()}</div><button class="full" id="quickAdd">＋ 支出を記録</button><div class="card"><h2>最近の記録</h2>${rows(state.entries.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5))}</div>`}function rows(list){return list.length?list.map(e=>`<div class="row flex"><div><strong>${esc(state.categories.find(c=>c.id===e.categoryId)?.name||'削除済み分類')}</strong><div class="muted">${esc(e.date)} · ${esc(e.payment||'未設定')}${e.shop?' · '+esc(e.shop):''}</div>${e.memo?`<div class="small">${esc(e.memo)}</div>`:''}</div><div class="right nowrap"><strong>${yen(e.amount)}</strong><div><button class="ghost" data-edit="${esc(e.id)}">編集</button><button class="ghost danger" data-delete="${esc(e.id)}">削除</button></div></div></div>`).join(''):'<p class="muted">記録はまだありません。</p>'}function entries(){return `<div class="card">${monthControl()}<h2 class="space">支出履歴</h2>${rows(records().slice().sort((a,b)=>b.date.localeCompare(a.date)))}</div><button class="full" id="quickAdd">＋ 支出を記録</button>`}function analysis(){let arr=[];for(let i=11;i>=0;i--){let d=new Date(Number(month.slice(0,4)),Number(month.slice(5))-1-i,1),m=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,s=sums(m);arr.push({m,...s})}let max=Math.max(1,...arr.map(a=>a.spent));return `<div class="card">${monthControl()}<h2 class="space">分類別分析</h2>${categoriesHTML()}</div><div class="card"><h2>直近12か月の推移</h2><div style="display:flex;align-items:end;gap:5px;height:170px;border-bottom:1px solid #ddd">${arr.map(a=>`<div title="${esc(a.m)}: ${yen(a.spent)}" style="flex:1;height:${a.spent?Math.max(3,a.spent/max*100):0}%;display:flex;flex-direction:column-reverse;overflow:hidden;border-radius:4px 4px 0 0">${state.categories.map(c=>{let v=a.r.filter(e=>e.categoryId===c.id).reduce((t,e)=>t+e.amount,0);return `<div style="height:${a.spent?v/a.spent*100:0}%;background:${color(c)};flex-shrink:0"></div>`}).join('')}</div>`).join('')}</div><div class="flex muted"><span>${arr[0].m}</span><span>${arr[11].m}</span></div><div class="space" style="display:flex;flex-wrap:wrap;gap:10px">${state.categories.map(c=>`<span class="small"><span style="display:inline-block;width:10px;height:10px;background:${color(c)};border-radius:2px;margin-right:4px"></span>${esc(c.name)}</span>`).join('')}</div><div class="muted space">直近12か月合計：${yen(arr.reduce((s,a)=>s+a.spent,0))}</div></div><div class="card"><h2>前月比較</h2>${(()=>{let d=new Date(+month.slice(0,4),+month.slice(5)-2,1),prev=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,diff=sums().spent-sums(prev).spent;return `<div class="big ${diff>0?'danger':''}">${diff>0?'+':diff<0?'−':''}${yen(Math.abs(diff))}</div><p class="muted">前月 ${yen(sums(prev).spent)} → 当月 ${yen(sums().spent)}</p>`})()}</div>`}function settings(){return `<div class="card"><h2>分類と月間予算</h2><p class="muted">予算変更は表示中の月に適用します。基本予算は翌月以降の初期値です。</p>${monthControl()}${state.categories.map(c=>`<div class="row"><div class="flex"><strong>${esc(c.name)}</strong><button class="ghost" data-delcat="${esc(c.id)}">削除</button></div><div class="grid"><div><label>この月の予算</label><input type="number" min="0" step="1" data-budget="${esc(c.id)}" value="${budget(c)}"></div><div><label>基本予算</label><input type="number" min="0" step="1" data-base="${esc(c.id)}" value="${c.budget}"></div></div><div class="flex space"><button class="secondary" data-rename="${esc(c.id)}">名前を変更</button><label style="margin:0;display:flex;align-items:center;gap:8px">色 <input aria-label="${esc(c.name)}の色" type="color" data-color="${esc(c.id)}" value="${color(c)}" style="width:54px;height:40px;padding:3px;cursor:pointer"></label></div></div>`).join('')}<button class="secondary full space" id="addCategory">＋ 分類を追加</button></div><div class="card"><h2>支払方法</h2><p class="muted">${state.payments.map(esc).join('・')}</p><button class="secondary" id="addPayment">追加</button><button class="ghost" id="removePayment">削除</button></div><div class="card"><h2>バックアップ</h2><p class="muted">データはこの端末のブラウザに保存されます。機種変更やブラウザのデータ削除に備えて、定期的にバックアップしてください。</p><button id="exportJson">バックアップ保存</button><button class="secondary" id="exportCsv">CSV書き出し</button><label for="importJson">バックアップを復元（JSON）</label><input type="file" id="importJson" accept="application/json,.json"></div>`}function render(){['home','entries','analysis','settings'].forEach(x=>$(x).classList.toggle('hidden',x!==tab));$(tab).innerHTML=({home,entries,analysis,settings})[tab]();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.querySelectorAll('#prevMonth,#nextMonth').forEach(b=>b.onclick=()=>{let d=new Date(+month.slice(0,4),+month.slice(5)-1+(b.id==='nextMonth'?1:-1),1);month=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;render()});document.querySelectorAll('#quickAdd').forEach(b=>b.onclick=()=>edit());document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{tab=b.dataset.go;render()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));if(tab==='settings')settingsEvents()}
function edit(id){if(!state.categories.length){alert('先に分類を追加してください。');tab='settings';render();return}let e=state.entries.find(x=>x.id===id);$('dialogTitle').textContent=e?'支出を編集':'支出を記録';$('entryId').value=e?.id||'';$('date').value=e?.date||today();$('category').innerHTML=state.categories.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');$('category').value=e?.categoryId||state.categories[0].id;$('payment').innerHTML=state.payments.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('');$('payment').value=e?.payment||state.payments[0]||'';$('amount').value=e?.amount||'';$('shop').value=e?.shop||'';$('memo').value=e?.memo||'';$('editDialog').showModal()}
$('cancelDialog').onclick=()=>$('editDialog').close();$('entryForm').onsubmit=ev=>{ev.preventDefault();let amount=Number($('amount').value),date=$('date').value;if(!Number.isSafeInteger(amount)||amount<=0||amount>99999999||!/^\d{4}-\d{2}-\d{2}$/.test(date)){alert('日付と金額を確認してください。');return}let id=$('entryId').value,entry={id:id||crypto.randomUUID(),date,categoryId:$('category').value,amount,payment:$('payment').value,shop:$('shop').value.trim(),memo:$('memo').value.trim()};if(id){let i=state.entries.findIndex(e=>e.id===id);if(i>=0)state.entries[i]=entry}else state.entries.push(entry);if(save()){$('editDialog').close();month=date.slice(0,7);render()}};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});function settingsEvents(){document.querySelectorAll('[data-color]').forEach(el=>el.onchange=()=>{let c=state.categories.find(x=>x.id===el.dataset.color);if(c&&/^#[0-9a-fA-F]{6}$/.test(el.value)){c.color=el.value;save();render()}});document.querySelectorAll('[data-budget]').forEach(el=>el.onchange=()=>{let n=Number(el.value);if(!Number.isSafeInteger(n)||n<0){alert('0以上の整数を入力してください');render();return}(state.budgets[month]??={})[el.dataset.budget]=n;save();render()});document.querySelectorAll('[data-base]').forEach(el=>el.onchange=()=>{let n=Number(el.value);if(!Number.isSafeInteger(n)||n<0){alert('0以上の整数を入力してください');render();return}state.categories.find(c=>c.id===el.dataset.base).budget=n;save();render()});$('addCategory').onclick=()=>{let name=prompt('新しい分類名');if(!name?.trim())return;name=name.trim().slice(0,30);if(state.categories.some(c=>c.name===name)){alert('同じ名前があります');return}state.categories.push({id:crypto.randomUUID(),name,budget:0,color:PALETTE[state.categories.length%PALETTE.length]});save();render()};document.querySelectorAll('[data-rename]').forEach(b=>b.onclick=()=>{let c=state.categories.find(c=>c.id===b.dataset.rename),n=prompt('分類名',c.name);if(!n?.trim())return;n=n.trim().slice(0,30);if(state.categories.some(x=>x!==c&&x.name===n)){alert('同じ名前があります');return}c.name=n;save();render()});document.querySelectorAll('[data-delcat]').forEach(b=>b.onclick=()=>{let c=state.categories.find(c=>c.id===b.dataset.delcat);if(state.entries.some(e=>e.categoryId===c.id)){alert('この分類の記録が残っています。削除前に記録を整理してください。');return}if(confirm(`「${c.name}」を削除しますか？`)){state.categories=state.categories.filter(x=>x!==c);save();render()}});$('addPayment').onclick=()=>{let n=prompt('支払方法の名前');if(n?.trim()&&!state.payments.includes(n.trim())){state.payments.push(n.trim().slice(0,30));save();render()}};$('removePayment').onclick=()=>{let n=prompt('削除する支払方法名を入力\n'+state.payments.join(' / '));if(!state.payments.includes(n))return;if(state.entries.some(e=>e.payment===n)){alert('この支払方法の記録が残っています');return}state.payments=state.payments.filter(x=>x!==n);save();render()};$('exportJson').onclick=()=>download(JSON.stringify(state,null,2),'pocket-budget-backup.json','application/json');$('exportCsv').onclick=()=>{let rows=[['日付','分類','金額','支払方法','店名','メモ'],...state.entries.map(e=>[e.date,state.categories.find(c=>c.id===e.categoryId)?.name||'',e.amount,e.payment,e.shop,e.memo])];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download(csv,'pocket-budget-records.csv','text/csv;charset=utf-8')};$('importJson').onchange=async ev=>{let file=ev.target.files[0];if(!file)return;try{if(file.size>5e6)throw Error('ファイルが大きすぎます');let x=JSON.parse(await file.text());if(!valid(x)||!x.payments.every(p=>typeof p==='string')||!x.entries.every(e=>Number.isSafeInteger(e.amount)&&e.amount>0))throw Error('バックアップ形式が正しくありません');if(!confirm('現在の記録をバックアップの内容で上書きします。続けますか？'))return;state=x;save();render();alert('復元しました')}catch(e){alert('復元できません：'+e.message)}}}function download(content,name,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}document.addEventListener('click',ev=>{let b=ev.target.closest('[data-delete]');if(b){let e=state.entries.find(x=>x.id===b.dataset.delete);if(e&&confirm('この記録を削除しますか？')){state.entries=state.entries.filter(x=>x.id!==e.id);save();render()}}});render();})();
</script></body></html>
